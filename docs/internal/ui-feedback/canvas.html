<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Audio feedback — direction</title><link rel="stylesheet" href="../../../web/src/styles/tokens.css"><style>body{margin:0;background:#b8c3c8;color:#17232a;font:15px system-ui}.window{margin:44px 10px;width:calc(100% - 24px);height:calc(100vh - 130px);border:2px solid #22313b;background:#edf0e9;box-shadow:2px 2px 0 #22313b}.head{display:flex;align-items:center;justify-content:space-between;padding:10px;background:#346379;color:white;font-weight:650}.body{padding:20px}.target{outline:2px solid #346379;outline-offset:3px;padding:10px;background:white;max-width:260px}.strip{position:fixed;bottom:12px;right:12px;width:min(540px,calc(100vw - 48px));padding:12px;border:2px solid #22313b;background:#d6dde0;box-shadow:inset 1px 1px white,3px 3px #22313b;display:flex;gap:12px;align-items:center;flex-wrap:wrap}.identity{flex:1;min-width:100px}.caption{font:600 12px monospace;letter-spacing:.06em}.name{font-weight:650;margin-top:4px}.verbs{display:flex;gap:8px}.button{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 12px;border:1px solid #22313b;box-shadow:inset 1px 1px white,inset -1px -1px #657984;background:#d6dde0;font-weight:600}.primary{background:#346379;color:white}.local{font:600 12px monospace}</style></head><body><div class="window"><div class="head"><span>Project · Platform</span><span class="button">Feedback</span></div><div class="body"><div class="target">The selected element</div></div></div><aside class="strip"><div class="identity"><div class="caption">RECORDING</div><div class="name">Project · Platform</div></div><span class="local">LOCAL</span><div class="verbs"><span class="button primary">Stop and save</span><span class="button">Cancel</span></div></aside></body></html>

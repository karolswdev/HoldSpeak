name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  UV_SYSTEM_PYTHON: 1

jobs:
  docs-navigation:
    name: Documentation Navigation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check public documentation links and headings
        run: |
          python -m unittest discover -s tests/unit -p test_docs_navigation.py
          python scripts/check_docs.py
          python scripts/check_docs.py docs/internal/philo/*.md docs/internal/philo/adr/*.md docs/internal/philo/checks/*.md docs/internal/philo/visuals/README.md docs/internal/philo/desktop-prototypes/README.md agent/skills/*/SKILL.md
          # api-reference.json, boundary-candidates.json and graph.json are not
          # in git (owner ruling 2026-10-03): their --check proves the generator
          # runs clean and its output is valid, not that a committed copy matches.
          python scripts/philo_repository_census.py --check
          python scripts/philo_api_reference.py --check
          python scripts/philo_boundary_census.py --check
          python scripts/philo_doctor_reference.py --check
          python scripts/philo_config_reference.py --check
          python scripts/philo_graph_reference.py --check
          python scripts/validate_architecture.py
          python scripts/generate_capability_docs.py --check
          python scripts/check_doc_coverage.py --check

  web-quality:
    name: DeskOS Web Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Run the complete DeskOS contract
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run check

  critical-journeys:
    name: Critical Journeys (G0)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run the G0 critical journeys
        # HS-200-03: the four journeys a release candidate must complete —
        # runtime identity, backup/restore, the first kept sentence, and a
        # Project's first result. They run the real services with only the
        # external adapters substituted, so this job deliberately has NO local
        # model, NO PortAudio, NO macOS and no network: if a journey needs any
        # of those it is not a G0 journey.
        #
        # HOME is isolated so the run cannot touch an installation, which the
        # guard in tests/conftest.py also enforces. This job must be green;
        # it is reported separately from the historical jobs so a reader can
        # tell the release gate from the inherited backlog.
        run: |
          HOME=$(mktemp -d) uv run --extra test pytest -q -m critical tests/critical -p no:cacheprovider

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    env:
      # Some unit fences drive a real headless Chromium (the graph-walk
      # calibration, first-paint and readable-row fences). The run isolates
      # HOME, which hides Playwright's default cache, so pin the browsers
      # outside HOME, the same way the E2E job does.
      PLAYWRIGHT_BROWSERS_PATH: /tmp/holdspeak-playwright-browsers

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Some unit fences read an older revision with `git show <rev>:<path>`
          # (the PHILO-3-01 pre-fix route, the council revision the graph
          # join read). A depth-1 clone does not hold those objects.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright Chromium
        run: uv run --extra test playwright install --with-deps chromium

      - name: Run unit tests with coverage
        run: |
          # `uv run --extra test` syncs the project venv *with* the test extra
          # (pytest et al.) and runs in that same venv — no separate --system
          # install that uv run would otherwise ignore.
          # Isolate before pytest collection: a unit fixture can build the
          # default database while the runner HOME is still its passwd home,
          # which makes the suite's own HOME guard fail later in the run.
          HOME=$(mktemp -d) uv run --extra test pytest tests/unit/ -q -n auto --cov=holdspeak --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: unit
          name: unit-tests
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  integration-tests:
    name: Integration Tests (macOS)
    runs-on: macos-14  # Apple Silicon

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          # Install PortAudio for sounddevice
          brew install portaudio

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"  # Astro 6 requires Node >=22.12
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Build web frontend
        # The web/* integration tests serve the built Astro output from
        # holdspeak/static/_built/ (gitignored), so it must be built here.
        working-directory: web
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Run integration tests with coverage
        run: |
          # `uv run --extra test` resolves main + test deps into the venv it
          # executes in, so pytest is present (the old --system install went to
          # a different interpreter that uv run never used).
          #
          # HS-32-04: this job is where the ungated core-path smoke test
          # (tests/integration/test_core_path_smoke.py) runs for real — macOS
          # arm64 has `mlx-whisper` as a core dep, so the test drives a fixed
          # checked-in WAV through real Whisper ("tiny", downloaded on first
          # use) -> text -> the injection seam, asserting on the produced text.
          # It skips on backends-absent environments (e.g. the Linux unit job)
          # rather than being gated behind the never-in-CI metal/spoken_e2e
          # markers.
          uv run --extra test python -m pytest tests/integration/ -q -n auto --cov=holdspeak --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: integration
          name: integration-tests
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  e2e-tests:
    name: Scoped Browser Tests (macOS)
    runs-on: macos-14  # Apple Silicon
    env:
      # Several real-hub fixtures isolate HOME. Keep browser discovery
      # independent from that application-data sandbox.
      PLAYWRIGHT_BROWSERS_PATH: /tmp/holdspeak-playwright-browsers
      # HS-200-03 follow-through: the same law for the mermaid guard's
      # browser. `tests/e2e/test_mermaid_renders.py` renders through
      # mermaid-cli, which is a puppeteer program; puppeteer's default
      # cache is `$HOME/.cache/puppeteer`, which an isolated HOME hides.
      # Pin it outside HOME so the pre-warm step below and the test agree.
      PUPPETEER_CACHE_DIR: /tmp/holdspeak-puppeteer

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # scripts/glass_for.py diffs against the base branch.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          # Install PortAudio for sounddevice
          brew install portaudio

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Build production web bundle
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Install Playwright Chromium and WebKit
        # WebKit: the PHILO-8-02 delete fence runs one case on both engines
        # because Astra reproduced that defect in WebKit
        # (tests/e2e/test_philo8_one_delete_glass.py, the engine parametrize).
        run: uv run --extra test playwright install chromium webkit

      - name: Pre-warm the mermaid renderer
        # HS-200-03 follow-through. Without this the mermaid guard fell back
        # to `npx --yes @mermaid-js/mermaid-cli`, which downloads the CLI and
        # a Chromium into the throwaway HOME on every single render; the
        # 300s pytest-timeout killed the test (and, with it, the whole E2E
        # run's report) on run 34059711954. Installing it once here puts
        # `mmdc` on PATH and the browser in PUPPETEER_CACHE_DIR, both of
        # which survive an isolated HOME.
        run: |
          npm install -g @mermaid-js/mermaid-cli
          mmdc --version

      - name: Gate the live runtime bus
        env:
          HOLDSPEAK_REQUIRE_LIVE_BUS: "1"
        run: |
          HOME_REAL=$HOME
          HOME=$(mktemp -d) npm_config_cache=$HOME_REAL/.npm uv run --extra test python -m pytest tests/e2e/test_live_bus.py -v

      - name: Run the browser tests that cover the change
        run: |
          # Owner ruling 2026-10-03: a pull request runs only the browser
          # tests that read the changed code (scripts/glass_for.py). Every
          # browser test runs in the nightly workflow (nightly.yml).
          #
          # HOME is isolated so no rig can touch an installation, but the
          # caches the browsers live in are carried across explicitly:
          # PLAYWRIGHT_BROWSERS_PATH and PUPPETEER_CACHE_DIR (job env, both
          # outside HOME) and the warm npm cache.
          BASE="origin/${{ github.base_ref || 'main' }}"
          if [ "${{ github.event_name }}" = "push" ]; then BASE="${{ github.event.before }}"; fi
          TESTS=$(uv run --extra test python scripts/glass_for.py --base "$BASE" --paths)
          echo "browser tests: ${TESTS:-none}"
          if [ -z "$TESTS" ]; then exit 0; fi
          HOME_REAL=$HOME
          HOME=$(mktemp -d) npm_config_cache=$HOME_REAL/.npm uv run --extra test python -m pytest $TESTS -q -n auto -m "e2e and not metal" --ignore=tests/e2e/test_live_bus.py

  linux-smoke:
    name: Linux Smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libportaudio2

      - name: Install dependencies
        run: |
          # Linux smoke should use explicit Linux extras and avoid Apple-only deps.
          uv pip install -e ".[test,linux]" --system

      - name: Run Linux smoke checks
        run: |
          bash scripts/linux_smoke.sh

  all-tests:
    name: All Tests Summary
    runs-on: ubuntu-latest
    needs: [critical-journeys, unit-tests, integration-tests, e2e-tests, linux-smoke]
    if: always()

    steps:
      - name: Check test results
        run: |
          if [[ "${{ needs.critical-journeys.result }}" == "failure" ]] || \
             [[ "${{ needs.unit-tests.result }}" == "failure" ]] || \
             [[ "${{ needs.integration-tests.result }}" == "failure" ]] || \
             [[ "${{ needs.e2e-tests.result }}" == "failure" ]] || \
             [[ "${{ needs.linux-smoke.result }}" == "failure" ]]; then
            echo "One or more test jobs failed"
            exit 1
          fi
          echo "All test jobs passed or were skipped"

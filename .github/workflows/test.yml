name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  HOLDSPEAK_SKIP_WEB_BUILD: "1"
  PLAYWRIGHT_BROWSERS_PATH: /tmp/holdspeak-playwright-browsers
  PUPPETEER_CACHE_DIR: /tmp/holdspeak-puppeteer

jobs:
  docs-navigation:
    name: Documentation Navigation
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - name: Generate untracked documentation inputs in dependency order
        run: |
          uv sync --extra dev
          scripts/gen_docs.sh
      - name: Check public documentation links and headings
        run: |
          export HOME=$(mktemp -d)
          python -m unittest discover -s tests/unit -p test_docs_navigation.py
          python scripts/check_docs.py
          python scripts/check_docs.py docs/internal/philo/*.md docs/internal/philo/adr/*.md docs/internal/philo/checks/*.md docs/internal/philo/visuals/README.md docs/internal/philo/desktop-prototypes/README.md agent/skills/*/SKILL.md
          # api-reference.json, boundary-candidates.json and graph.json are not
          # in git (owner ruling 2026-10-03): their --check proves the generator
          # runs clean and its output is valid, not that a committed copy matches.
          python scripts/philo_repository_census.py --check
          python scripts/philo_api_reference.py --check
          python scripts/philo_boundary_census.py --check
          python scripts/philo_doctor_reference.py --check
          python scripts/philo_config_reference.py --check
          python scripts/philo_graph_reference.py --check
          python scripts/validate_architecture.py
          python scripts/generate_capability_docs.py --check
          python scripts/check_doc_coverage.py --check

  web-quality:
    name: DeskOS Web Quality
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare the test lock
        run: python -m venv .venv
      - name: Run the complete DeskOS contract
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run tokens:check
          npm run tokens:gate
          npm run guard:architecture
          npm run typecheck
          HOME_REAL=$HOME
          export HOME=$(mktemp -d) npm_config_cache=$HOME_REAL/.npm
          ../.venv/bin/python ../scripts/test_lock.py -- ./node_modules/.bin/vitest run --maxWorkers=4
          npm run build
          npm run bundle:gate

  non-browser:
    name: Non-browser Suite (macOS)
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install PortAudio
        run: brew install portaudio
      - name: Build web bundle once
        working-directory: web
        run: npm ci --no-audit --no-fund && npm run build
      - name: Install test dependencies
        run: uv sync --extra dev
      - name: Run the complete non-browser suite
        run: |
          HOME_REAL=$HOME
          export HOME=$(mktemp -d) npm_config_cache=$HOME_REAL/.npm
          uv run --no-sync python scripts/test_lock.py -- uv run --no-sync pytest -q -n 3 --dist worksteal -m "not slow" -p no:cacheprovider tests/unit tests/integration tests/critical tests/web tests/mcp tests/uat

  e2e-tests:
    name: Scoped Browser Tests (macOS)
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Select browser tests before provisioning
        id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          TESTS=$(python scripts/test_lock.py -- python scripts/glass_for.py --base "$BASE" --paths)
          echo "paths=$TESTS" >> "$GITHUB_OUTPUT"
          echo "browser tests: ${TESTS:-none (no browser-covered code changed)}"
      - uses: astral-sh/setup-uv@v5
        if: steps.scope.outputs.paths != ''
      - uses: actions/setup-node@v4
        if: steps.scope.outputs.paths != ''
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install PortAudio
        if: steps.scope.outputs.paths != ''
        run: brew install portaudio
      - name: Build web bundle once
        if: steps.scope.outputs.paths != ''
        working-directory: web
        run: npm ci --no-audit --no-fund && npm run build
      - name: Install test dependencies and browsers
        if: steps.scope.outputs.paths != ''
        run: |
          uv sync --extra dev
          uv run --no-sync playwright install chromium firefox
          npm install -g @mermaid-js/mermaid-cli
      - name: Run the selected browser tests
        if: steps.scope.outputs.paths != ''
        env:
          TESTS: ${{ steps.scope.outputs.paths }}
        run: |
          HOME_REAL=$HOME
          export HOME=$(mktemp -d) npm_config_cache=$HOME_REAL/.npm
          uv run --no-sync python scripts/test_lock.py -- uv run --no-sync pytest $TESTS -q -n 2 --dist worksteal -m "e2e and not metal" --ignore=tests/e2e/test_metal.py

  linux-smoke:
    name: Linux Smoke
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libportaudio2

      - name: Install dependencies
        run: |
          # Linux smoke should use explicit Linux extras and avoid Apple-only deps.
          uv pip install -e ".[test,linux]" --system

      - name: Run Linux smoke checks
        run: |
          bash scripts/linux_smoke.sh

  all-tests:
    name: All Tests Summary
    runs-on: ubuntu-24.04
    needs: [docs-navigation, web-quality, non-browser, e2e-tests, linux-smoke]
    if: always()
    steps:
      - name: Require every kept job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ["RESULTS"])
          failed = {name: job["result"] for name, job in results.items() if job["result"] != "success"}
          if failed:
              raise SystemExit(f"Jobs did not pass: {failed}")
          print("Every kept job passed")
          PY

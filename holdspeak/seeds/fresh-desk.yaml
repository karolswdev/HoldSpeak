# HS-140-04 — a furnished desk without invented personal data or AI readiness.
# Ordinary seed creates only ids never seen before; Reset to seed is the one
# explicit force-restore path for this packaged text and organization.

directories:
  - id: hs-seed-inbox
    name: Inbox
    member_ids: [hs-seed-start-here]
  - id: hs-seed-personal
    name: Personal
    member_ids: [hs-seed-about-me, hs-seed-how-i-like-help]
  - id: hs-seed-work
    name: Work
    member_ids: [hs-seed-current-priorities]
  - id: hs-seed-meetings
    name: Meetings
    member_ids: [hs-seed-meeting-preferences]
  - id: hs-seed-decisions
    name: Decisions
  - id: hs-seed-reference
    name: Reference
    member_ids: [hs-seed-people-vocabulary]

notes:
  - id: hs-seed-start-here
    title: Start here
    body_markdown: |
      These drawers and notes are yours to edit, rename, move, or delete.

      Everyday context is never automatically included in an AI request. Attach it in Ask, or select it for an Agent, only when you want it used.

      Normal Desk sync continues to follow your existing device-pairing choices.
  - id: hs-seed-about-me
    title: About me
    body_markdown: |
      What would be useful to share when you explicitly attach this context?

      - Name or form of address: [example: ]
      - Work or life context: [example: ]
  - id: hs-seed-current-priorities
    title: Current priorities
    body_markdown: |
      What deserves attention right now?

      - Priority: [example: ]
      - Why it matters: [example: ]
      - Next step: [example: ]
  - id: hs-seed-how-i-like-help
    title: How I like help
    body_markdown: |
      How should help be shaped when you explicitly attach this context?

      - Tone: [example: direct, warm, concise]
      - Useful format: [example: bullets, draft, checklist]
      - Avoid: [example: ]
  - id: hs-seed-people-vocabulary
    title: People & vocabulary
    body_markdown: |
      Which names, terms, or abbreviations would be useful to explain?

      - Name or team: [example: ]
      - Term or abbreviation: [example: ]
      - Meaning: [example: ]
  - id: hs-seed-meeting-preferences
    title: Meeting preferences
    body_markdown: |
      What would make a meeting record useful?

      - Capture: [example: decisions, actions, open questions]
      - Follow-up format: [example: ]
      - People to include: [example: ]

kbs:
  - id: hs-seed-everyday-context
    name: Everyday context
    member_ids:
      - hs-seed-about-me
      - hs-seed-current-priorities
      - hs-seed-how-i-like-help
      - hs-seed-people-vocabulary
      - hs-seed-meeting-preferences

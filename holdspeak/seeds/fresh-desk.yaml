# HS-140-04 — a furnished desk without invented personal data or AI readiness.
# Ordinary seed creates only ids never seen before; Reset to seed is the one
# explicit force-restore path for this packaged text and organization.
#
# PHILO-17 (words): a fresh desk carries only Start here and the Weekly update
# prompt. About me, Current priorities, 1:1 prep and Everyday context are
# parked as text in docs/internal/PARKED-SEED-NOTES.md. Ordinary seed never
# removes those records from a desk seeded before this manifest.
#
# PHILO-17 U18 (owner walk 2026-10-10: after ten minutes he did not know what
# the product is for): Start here is the loop in three jobs, each with its
# door button (`[Label](door:<name>)`, web/src/desk/surface/Material.tsx
# NOTE_DOORS). 1:1 prep opens People, where each person has Prep. Weekly
# update stays a seeded `prompt` note: the Thread /prompt starter. The old
# Start here text is parked in docs/internal/PARKED-SEED-NOTES.md.

directories:
  - id: hs-seed-inbox
    name: Inbox
    member_ids: [hs-seed-start-here]
  - id: hs-seed-personal
    name: Personal
    member_ids: []
  - id: hs-seed-work
    name: Work
    member_ids: []
  - id: hs-seed-meetings
    name: Meetings
  - id: hs-seed-decisions
    name: Decisions
  - id: hs-seed-reference
    name: Reference

notes:
  - id: hs-seed-start-here
    title: Start here
    body_markdown: |
      HoldSpeak does three jobs for you.

      - [Record a meeting](door:record-live) HoldSpeak writes the summary, the decisions and the actions.
      - [Dictate](door:dictate) Speak, and HoldSpeak types your words.
      - [Review what needs you](door:needs) See the actions and decisions that wait for you.

      These notes are yours. Edit, move or delete them.
  # A Thread starter for /prompt (orchestrator ruling 2026-10-11), not a
  # desk job: the Thread composer's /prompt lists notes tagged `prompt`.
  - id: hs-seed-prompt-weekly-update
    title: Weekly update
    tags: [prompt]
    body_markdown: |
      Summarize what happened this week.
      Focus on decisions made, commitments moved, and open questions.
      One paragraph per topic, no filler.
      End with what needs attention next week.
recipes:
  - id: hs-seed-mode-desk
    name: Desk
    avatar: "#6B7280"
    kind: mode
    system_prompt: "You have read access to the full desk. Observe and inform, never act."
  - id: hs-seed-mode-chase
    name: Chase
    avatar: "#2563EB"
    kind: mode
    system_prompt: "You can read the desk and act on people and follow-through. Move work forward."
  - id: hs-seed-mode-draft
    name: Draft
    avatar: "#9333EA"
    kind: mode
    system_prompt: "Write freely. No tools, no context lookups, just composition."
  - id: hs-seed-mode-plan
    name: Plan
    avatar: "#059669"
    kind: mode
    system_prompt: "Reflect on decisions, thoughts, and memory. Plan, do not execute."

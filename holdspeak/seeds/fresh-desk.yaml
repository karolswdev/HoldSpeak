# HS-140-04 — a furnished desk without invented personal data or AI readiness.
# Ordinary seed creates only ids never seen before; Reset to seed is the one
# explicit force-restore path for this packaged text and organization.
#
# PHILO-15 11 (B20, owner ruling 2026-10-07): the seed carries only the notes a
# Senior Architect wants on day one, at most five: Start here, About me, 1:1
# prep, Current priorities, Weekly update. The five notes it carried before
# (How I like help, People & vocabulary, Meeting preferences, Effect guard,
# Egress guard) are parked as text in docs/internal/PARKED-SEED-NOTES.md.

directories:
  - id: hs-seed-inbox
    name: Inbox
    member_ids: [hs-seed-start-here]
  - id: hs-seed-personal
    name: Personal
    member_ids: [hs-seed-about-me]
  - id: hs-seed-work
    name: Work
    member_ids: [hs-seed-current-priorities]
  - id: hs-seed-meetings
    name: Meetings
  - id: hs-seed-decisions
    name: Decisions
  - id: hs-seed-reference
    name: Reference

notes:
  - id: hs-seed-start-here
    title: Start here
    body_markdown: |
      These drawers and notes are yours to edit, rename, move, or delete.

      Everyday context is never automatically included in an AI request. Attach it in Ask, or select it for an Agent, only when you want it used.

      Normal Desk sync continues to follow your existing device-pairing choices.
  - id: hs-seed-about-me
    title: About me
    body_markdown: |
      What would be useful to share when you explicitly attach this context?

      - Name or form of address: [example: ]
      - Work or life context: [example: ]
  - id: hs-seed-current-priorities
    title: Current priorities
    body_markdown: |
      What deserves attention right now?

      - Priority: [example: ]
      - Why it matters: [example: ]
      - Next step: [example: ]
  - id: hs-seed-prompt-weekly-update
    title: Weekly update
    tags: [prompt]
    body_markdown: |
      Summarize what happened this week.
      Focus on decisions made, commitments moved, and open questions.
      One paragraph per topic, no filler.
      End with what needs attention next week.
  - id: hs-seed-prompt-one-on-one-prep
    title: 1:1 prep
    tags: [prompt]
    body_markdown: |
      Prepare for my next 1:1.
      List open commitments, recent decisions that need follow-up,
      and any blockers worth raising.
      Keep it to three sections, one paragraph each.

recipes:
  - id: hs-seed-mode-desk
    name: Desk
    avatar: "#6B7280"
    kind: mode
    system_prompt: "You have read access to the full desk. Observe and inform, never act."
  - id: hs-seed-mode-chase
    name: Chase
    avatar: "#2563EB"
    kind: mode
    system_prompt: "You can read the desk and act on people and follow-through. Move work forward."
  - id: hs-seed-mode-draft
    name: Draft
    avatar: "#9333EA"
    kind: mode
    system_prompt: "Write freely. No tools, no context lookups, just composition."
  - id: hs-seed-mode-plan
    name: Plan
    avatar: "#059669"
    kind: mode
    system_prompt: "Reflect on decisions, thoughts, and memory. Plan, do not execute."

kbs:
  - id: hs-seed-everyday-context
    name: Everyday context
    member_ids:
      - hs-seed-about-me
      - hs-seed-current-priorities

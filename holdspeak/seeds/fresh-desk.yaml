# HS-119-03 — the toolkit seed.
#
# Honest at zero, ready to configure. Five inference profiles (three
# local tiers + two cloud placeholders), one starter workbench wired
# to the local resolver, and two empty zones. No demo content, no
# prefilled notes, no seeded flattery. Article VI.
#
# Deterministic `hs-seed-*` ids are the idempotency contract:
# re-applying upserts in place — never a duplicate desk.

profiles:
  - id: hs-seed-local-4b-resolver
    name: "Local 4B (resolver)"
    kind: openAICompatible
    base_url: ""
    model: ""
    context_limit: 8192
    requires_key: false

  - id: hs-seed-local-small
    name: "Local small"
    kind: openAICompatible
    base_url: ""
    model: ""
    context_limit: 32768
    requires_key: false

  - id: hs-seed-local-medium
    name: "Local medium"
    kind: openAICompatible
    base_url: ""
    model: ""
    context_limit: 131072
    requires_key: false

  - id: hs-seed-cloud-openai
    name: "OpenAI"
    kind: openAICompatible
    base_url: "https://api.openai.com/v1"
    model: ""
    context_limit: 128000
    requires_key: true

  - id: hs-seed-cloud-anthropic
    name: "Anthropic"
    kind: openAICompatible
    base_url: "https://api.anthropic.com/v1"
    model: ""
    context_limit: 200000
    requires_key: true

workbenches:
  - id: hs-seed-workbench
    name: Workbench
    resolver_profile_id: hs-seed-local-4b-resolver

directories:
  - id: hs-seed-inbox
    name: Inbox
  - id: hs-seed-work
    name: Work

<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;650;700&family=Space+Grotesk:wght@600;650;700&display=swap">
  <style>
    body { margin: 0; background: #0e0f13; }
    a { color: #a86e4a; } a:hover { color: #bc8058; }
    @keyframes surface-chip-pulse { from { opacity: 1 } to { opacity: .4 } }
  </style>
</helmet>

<!-- Window shell (393px phone) -->
<div style="width:393px; border:1px solid #363b50; border-radius:2px; background:#15171d; box-shadow:inset 1px 1px 0 rgba(255,255,255,0.14), inset -1px -1px 0 rgba(0,0,0,0.40); display:flex; flex-direction:column;">

  <!-- Title bar -->
  <div style="height:40px; padding:0 12px; display:flex; align-items:center; gap:8px; background:#242833; border-radius:1px 1px 0 0; flex-shrink:0;">
    <div style="display:flex; gap:6px; align-items:center; flex-shrink:0;">
      <span style="width:12px; height:12px; border-radius:2px; background:#f87171; display:block;"></span>
      <span style="width:12px; height:12px; border-radius:2px; background:#fbbf24; display:block;"></span>
      <span style="width:12px; height:12px; border-radius:2px; background:#34d399; display:block;"></span>
    </div>
    <span style="font:700 14px/1 'Space Grotesk','Inter',system-ui,sans-serif; color:#f2f3f5;">New Project</span>
  </div>

  <!-- Body -->
  <div style="flex:1; padding:12px 14px 14px; display:flex; flex-direction:column; gap:18px;">

    <!-- ProgressPlan -->
    <div style="display:flex; flex-direction:column; gap:2px; font:12px 'JetBrains Mono',monospace; color:#f2f3f5;">
      <div style="display:flex; align-items:center; gap:6px; min-height:24px; padding:2px 6px;">
        <span style="width:14px; text-align:center; font-size:11px; line-height:1; color:#34d399;">✓</span>
        <span style="flex:1; font-weight:500; color:#34d399;">Outcome</span>
      </div>
      <div style="display:flex; align-items:center; gap:6px; min-height:24px; padding:2px 6px;">
        <span style="width:14px; text-align:center; font-size:11px; line-height:1; color:#56c7f5; animation:surface-chip-pulse 200ms ease-in-out infinite alternate;">●</span>
        <span style="flex:1; font-weight:500; color:#56c7f5;">Notice</span>
      </div>
      <div style="display:flex; align-items:center; gap:6px; min-height:24px; padding:2px 6px;">
        <span style="width:14px; text-align:center; font-size:11px; line-height:1; color:#9ba2b0;">&#9675;</span>
        <span style="flex:1; font-weight:500; color:#9ba2b0;">Sources</span>
      </div>
      <div style="display:flex; align-items:center; gap:6px; min-height:24px; padding:2px 6px;">
        <span style="width:14px; text-align:center; font-size:11px; line-height:1; color:#9ba2b0;">&#9675;</span>
        <span style="flex:1; font-weight:500; color:#9ba2b0;">Review</span>
      </div>
    </div>

    <!-- Answered OUTCOME collapsed -->
    <div style="display:grid; grid-template-columns:20px minmax(0,1fr) max-content; align-items:start; gap:0 8px; min-height:26px; padding:4px 6px; font:12px/1.35 'JetBrains Mono',monospace; color:#f2f3f5; cursor:pointer; background:rgba(0,0,0,0.28); box-shadow:inset 1px 1px 0 rgba(0,0,0,0.30), inset -1px -1px 0 rgba(255,255,255,0.07);">
      <span style="color:#34d399; font-size:11px; text-align:center; padding-top:2px;">✓</span>
      <span>The first real project through the whole Room, attended</span>
      <button style="min-height:24px; padding:0 8px; border:1px solid transparent; border-radius:0; background:transparent; color:#9ba2b0; font:600 11px/1 'JetBrains Mono',monospace; cursor:pointer;">Edit</button>
    </div>

    <!-- NOTICE section -->
    <div style="display:flex; flex-direction:column; gap:6px;">
      <h3 style="margin:0; font:600 10px/1 'JetBrains Mono',monospace; letter-spacing:0.06em; text-transform:uppercase; color:#9ba2b0;">NOTICE</h3>
      <div style="display:flex; align-items:stretch; width:100%; min-height:80px; border:1px solid #2a2e3e; background:#15171d; box-shadow:inset 1px 1px 0 rgba(0,0,0,0.30), inset -1px -1px 0 rgba(255,255,255,0.07);">
        <textarea style="flex:1; min-width:0; min-height:76px; border:0; background:transparent; box-shadow:none; padding:6px; font:400 12px/1.35 'JetBrains Mono',monospace; color:#767e8d; resize:none;" readonly>What would you want noticed without being asked?</textarea>
        <div style="display:flex; align-items:flex-start; padding:4px 4px 0 0;">
          <button style="width:20px; height:20px; border-radius:0; border:1px solid #2a2e3e; background:#1c1f27; box-shadow:inset 1px 1px 0 rgba(255,255,255,0.14), inset -1px -1px 0 rgba(0,0,0,0.40); display:grid; place-items:center; cursor:pointer; padding:0;">
            <svg width="10" height="10" viewBox="0 0 16 16" fill="none" stroke="#9ba2b0" stroke-width="1.5" stroke-linecap="round"><rect x="5" y="2" width="6" height="8" rx="3"></rect><path d="M3 8v1a5 5 0 0 0 10 0V8"></path><path d="M8 14v2"></path></svg>
          </button>
        </div>
      </div>
    </div>

    <!-- THE BRIEF (below on phone) -->
    <div style="display:flex; flex-direction:column; gap:6px; border-top:1px solid rgba(255,255,255,0.035); padding-top:8px;">
      <h3 style="margin:0; font:600 10px/1 'JetBrains Mono',monospace; letter-spacing:0.06em; text-transform:uppercase; color:#9ba2b0;">THE BRIEF</h3>
      <dl style="margin:0; display:grid; grid-template-columns:minmax(80px, max-content) minmax(0,1fr); gap:3px 14px; font-size:12px; font-family:'JetBrains Mono',monospace;">
        <dt style="color:#9ba2b0; font-weight:600; text-transform:uppercase; letter-spacing:0.06em; font-size:10px;">OUTCOME</dt>
        <dd style="margin:0; overflow-wrap:anywhere; color:#f2f3f5;">The first real project through the whole Room, attended</dd>
        <dt style="color:#9ba2b0; font-weight:600; text-transform:uppercase; letter-spacing:0.06em; font-size:10px;">NOTICE</dt>
        <dd style="margin:0; overflow-wrap:anywhere; color:#767e8d;">---</dd>
        <dt style="color:#9ba2b0; font-weight:600; text-transform:uppercase; letter-spacing:0.06em; font-size:10px;">SOURCES</dt>
        <dd style="margin:0; overflow-wrap:anywhere; color:#767e8d;">---</dd>
      </dl>
    </div>

  </div>

  <!-- Footer (reflows at narrow) -->
  <footer style="height:auto; min-height:36px; padding:4px 8px; background:#1c1f27; border-top:1px solid #2a2e3e; box-shadow:inset 1px 1px 0 rgba(255,255,255,0.14), inset -1px -1px 0 rgba(0,0,0,0.40); flex-shrink:0;">
    <div style="display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:4px;">
      <span style="font:10px 'JetBrains Mono',monospace; letter-spacing:0.06em; text-transform:uppercase; color:#9ba2b0;">2 OF 4</span>
      <div style="display:flex; align-items:center; gap:4px;">
        <button style="min-height:24px; padding:2px 8px; border:1px solid transparent; border-radius:0; background:transparent; color:#9ba2b0; font:600 11px/1 'JetBrains Mono',monospace; cursor:pointer;">Cancel setup</button>
        <button style="min-height:24px; padding:2px 8px; border:1px solid #a86e4a; border-radius:0; background:#a86e4a; color:#f2f3f5; font:600 11px/1 'JetBrains Mono',monospace; cursor:pointer; box-shadow:inset 0 1px 0 rgba(255,255,255,0.22), 0 1px 2px rgba(0,0,0,0.3);">Next</button>
      </div>
    </div>
  </footer>

</div>

</x-dc>
</body>
</html>

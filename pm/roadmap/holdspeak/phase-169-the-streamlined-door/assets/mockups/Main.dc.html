<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600;650;700&amp;family=Space+Grotesk:wght@600;650;700&amp;display=swap">
  <style>
    body { margin: 0; background: #0e0f13; }
  </style>
</helmet>

<!-- ═══ WINDOW "New Project" (640) — connected, picked ═══ -->
<div style="width:640px; border:1px solid #363b50; border-radius:2px; background:#15171d; box-shadow:inset 1px 1px 0 rgba(255,255,255,0.14), inset -1px -1px 0 rgba(0,0,0,0.40), inset 0 0 0 1px #2a2e3e; display:flex; flex-direction:column;">

  <!-- ─── TITLE BAR ─── -->
  <div style="height:40px; padding:0 12px; display:flex; align-items:center; gap:10px; background:#242833; border-radius:1px 1px 0 0; flex-shrink:0;">
    <div style="display:flex; gap:6px; align-items:center; flex-shrink:0;">
      <span style="width:12px; height:12px; border-radius:2px; background:#f87171; display:block;"></span>
      <span style="width:12px; height:12px; border-radius:2px; background:#fbbf24; display:block;"></span>
      <span style="width:12px; height:12px; border-radius:2px; background:#34d399; display:block;"></span>
    </div>
    <span style="font:700 17px/1 'Space Grotesk','Inter',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; color:#f2f3f5; white-space:nowrap;">New Project</span>
  </div>

  <!-- ─── BODY ─── -->
  <div style="flex:1; padding:12px 14px 14px; display:flex; flex-direction:column; gap:18px;">

    <!-- ═══ 1. OUTCOME WELL (EditInPlace + MicButton) ═══ -->
    <div>
      <div style="display:flex; align-items:center; min-height:44px; padding:8px 8px 8px 12px; background:#1c1f27; border:1px solid #2a2e3e; border-radius:2px; box-shadow:inset 1px 1px 0 rgba(0,0,0,0.30), inset -1px -1px 0 rgba(255,255,255,0.07);">
        <span style="flex:1; min-width:0; font:600 15px/1.4 'Inter',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; color:#f2f3f5;">Ship the Q4 platform on schedule with zero incidents</span>
        <!-- MicButton -->
        <span style="width:24px; height:24px; margin-left:8px; border:1px solid #2a2e3e; background:#1c1f27; box-shadow:inset 1px 1px 0 rgba(255,255,255,0.14), inset -1px -1px 0 rgba(0,0,0,0.40); display:grid; place-items:center; flex-shrink:0; cursor:pointer;">
          <svg width="10" height="10" viewBox="0 0 16 16" fill="none" stroke="#9ba2b0" stroke-width="1.5" stroke-linecap="square"><rect x="5" y="1" width="6" height="9" rx="0"></rect><path d="M3 8v1a5 5 0 0 0 10 0V8M8 14v2"></path></svg>
        </span>
      </div>
      <!-- Caption -->
      <div style="margin-top:4px; padding:0 2px; font:600 11px/1 'JetBrains Mono','SFMono-Regular','SF Mono',Consolas,'Liberation Mono',monospace; letter-spacing:0.06em; text-transform:uppercase; color:#767e8d;">THIS BECOMES THE PROJECT'S NAME</div>
    </div>

    <!-- ═══ 2. SOURCES 2 ═══ -->
    <div style="display:flex; flex-direction:column; gap:6px;">
      <div style="display:flex; align-items:baseline; gap:8px; border-top:1px solid rgba(255,255,255,0.035); padding-top:8px;">
        <h3 style="margin:0; font:600 11px/1 'JetBrains Mono','SFMono-Regular','SF Mono',Consolas,'Liberation Mono',monospace; letter-spacing:0.06em; text-transform:uppercase; color:#9ba2b0;">SOURCES <span style="color:#f2f3f5;">2</span></h3>
      </div>

      <div style="display:flex; flex-direction:column; gap:2px;">

        <!-- ─── GITHUB ROW (PICKED) ─── -->
        <div style="display:flex; align-items:start; border:1px solid #2a2e3e; border-radius:2px; background:#15171d;">
          <!-- Lead slot 52px -->
          <div style="width:52px; flex-shrink:0; display:flex; align-items:center; justify-content:center; padding-top:10px;">
            <span style="font:700 15px/1 'JetBrains Mono','SFMono-Regular','SF Mono',Consolas,'Liberation Mono',monospace; color:#767e8d;">GH</span>
          </div>
          <!-- Content: LINE 1 + LINE 2 -->
          <div style="flex:1; min-width:0; display:flex; flex-direction:column; gap:4px; padding:6px 12px 8px 0;">
            <!-- LINE 1: trigger + toggles -->
            <div style="display:flex; flex-wrap:wrap; align-items:center; gap:6px;">
              <!-- Scope trigger (gadget species: beveled control + chevron SVG) -->
              <button type="button" style="display:inline-flex; align-items:center; gap:6px; height:28px; padding:0 10px; border:1px solid #2a2e3e; border-radius:2px; background:#1c1f27; box-shadow:inset 1px 1px 0 rgba(255,255,255,0.14), inset -1px -1px 0 rgba(0,0,0,0.40); font:600 13px/1 'JetBrains Mono','SFMono-Regular','SF Mono',Consolas,'Liberation Mono',monospace; color:#f2f3f5; cursor:pointer; white-space:nowrap;">karolswdev/HoldSpeak<svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="#9ba2b0" stroke-width="1.5" stroke-linecap="square" style="flex-shrink:0;"><path d="M3 4.5L6 7.5L9 4.5"></path></svg></button>
              <!-- CheckGadget: OPEN PRS (ON) -->
              <span style="display:inline-flex; align-items:center; gap:4px; min-height:22px; padding:0 8px; border:1px solid #2a2e3e; border-radius:0; background:rgba(0,0,0,0.28); box-shadow:inset 1px 1px 0 rgba(0,0,0,0.30), inset -1px -1px 0 rgba(255,255,255,0.07); font:600 10px/1 'JetBrains Mono','SFMono-Regular','SF Mono',Consolas,'Liberation Mono',monospace; letter-spacing:0.08em; text-transform:uppercase; color:#34d399; cursor:pointer; white-space:nowrap;"><span style="flex:none; font-size:11px; line-height:1;">&#10003;</span>OPEN PRS</span>
              <!-- CheckGadget: CI (ON) -->
              <span style="display:inline-flex; align-items:center; gap:4px; min-height:22px; padding:0 8px; border:1px solid #2a2e3e; border-radius:0; background:rgba(0,0,0,0.28); box-shadow:inset 1px 1px 0 rgba(0,0,0,0.30), inset -1px -1px 0 rgba(255,255,255,0.07); font:600 10px/1 'JetBrains Mono','SFMono-Regular','SF Mono',Consolas,'Liberation Mono',monospace; letter-spacing:0.08em; text-transform:uppercase; color:#34d399; cursor:pointer; white-space:nowrap;"><span style="flex:none; font-size:11px; line-height:1;">&#10003;</span>CI</span>
            </div>
            <!-- LINE 2: count · [spacer] · EgressChip · Adjust -->
            <div style="display:flex; align-items:center; gap:6px;">
              <span style="font:12px/1 'JetBrains Mono','SFMono-Regular','SF Mono',Consolas,'Liberation Mono',monospace; color:#9ba2b0; white-space:nowrap;">12 open PRs · CI green</span>
              <span style="flex:1;"></span>
              <span style="display:inline-flex; align-items:center; min-height:18px; padding:0 8px; border:1px solid #2a2e3e; border-radius:0; background:rgba(0,0,0,0.28); box-shadow:inset 1px 1px 0 rgba(0,0,0,0.30), inset -1px -1px 0 rgba(255,255,255,0.07); font:600 10px/1 'JetBrains Mono','SFMono-Regular','SF Mono',Consolas,'Liberation Mono',monospace; letter-spacing:0.08em; text-transform:uppercase; color:#a86e4a;">GITHUB.COM</span>
              <button type="button" style="min-height:28px; padding:4px 12px; border:1px solid transparent; border-radius:0; background:transparent; color:#f2f3f5; font:600 12px/1 'JetBrains Mono','SFMono-Regular','SF Mono',Consolas,'Liberation Mono',monospace; cursor:pointer;">Adjust</button>
            </div>
          </div>
        </div>

        <!-- ─── JIRA ROW (PICKED) — identical structure ─── -->
        <div style="display:flex; align-items:start; border:1px solid #2a2e3e; border-radius:2px; background:#15171d;">
          <!-- Lead slot 52px -->
          <div style="width:52px; flex-shrink:0; display:flex; align-items:center; justify-content:center; padding-top:10px;">
            <span style="font:700 15px/1 'JetBrains Mono','SFMono-Regular','SF Mono',Consolas,'Liberation Mono',monospace; color:#767e8d;">J</span>
          </div>
          <!-- Content: LINE 1 + LINE 2 -->
          <div style="flex:1; min-width:0; display:flex; flex-direction:column; gap:4px; padding:6px 12px 8px 0;">
            <!-- LINE 1: trigger + toggles -->
            <div style="display:flex; flex-wrap:wrap; align-items:center; gap:6px;">
              <!-- Scope trigger (gadget species) -->
              <button type="button" style="display:inline-flex; align-items:center; gap:6px; height:28px; padding:0 10px; border:1px solid #2a2e3e; border-radius:2px; background:#1c1f27; box-shadow:inset 1px 1px 0 rgba(255,255,255,0.14), inset -1px -1px 0 rgba(0,0,0,0.40); font:600 13px/1 'JetBrains Mono','SFMono-Regular','SF Mono',Consolas,'Liberation Mono',monospace; color:#f2f3f5; cursor:pointer; white-space:nowrap;">KAN · WRONG<svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="#9ba2b0" stroke-width="1.5" stroke-linecap="square" style="flex-shrink:0;"><path d="M3 4.5L6 7.5L9 4.5"></path></svg></button>
              <!-- CheckGadget: OVERDUE (ON) -->
              <span style="display:inline-flex; align-items:center; gap:4px; min-height:22px; padding:0 8px; border:1px solid #2a2e3e; border-radius:0; background:rgba(0,0,0,0.28); box-shadow:inset 1px 1px 0 rgba(0,0,0,0.30), inset -1px -1px 0 rgba(255,255,255,0.07); font:600 10px/1 'JetBrains Mono','SFMono-Regular','SF Mono',Consolas,'Liberation Mono',monospace; letter-spacing:0.08em; text-transform:uppercase; color:#34d399; cursor:pointer; white-space:nowrap;"><span style="flex:none; font-size:11px; line-height:1;">&#10003;</span>OVERDUE</span>
              <!-- CheckGadget: DUE 7 DAYS (ON) -->
              <span style="display:inline-flex; align-items:center; gap:4px; min-height:22px; padding:0 8px; border:1px solid #2a2e3e; border-radius:0; background:rgba(0,0,0,0.28); box-shadow:inset 1px 1px 0 rgba(0,0,0,0.30), inset -1px -1px 0 rgba(255,255,255,0.07); font:600 10px/1 'JetBrains Mono','SFMono-Regular','SF Mono',Consolas,'Liberation Mono',monospace; letter-spacing:0.08em; text-transform:uppercase; color:#34d399; cursor:pointer; white-space:nowrap;"><span style="flex:none; font-size:11px; line-height:1;">&#10003;</span>DUE 7 DAYS</span>
              <!-- CheckGadget: BLOCKED (OFF) -->
              <span style="display:inline-flex; align-items:center; min-height:22px; padding:0 8px; border:1px solid #2a2e3e; border-radius:0; background:#1c1f27; box-shadow:inset 1px 1px 0 rgba(255,255,255,0.14), inset -1px -1px 0 rgba(0,0,0,0.40); font:600 10px/1 'JetBrains Mono','SFMono-Regular','SF Mono',Consolas,'Liberation Mono',monospace; letter-spacing:0.08em; text-transform:uppercase; color:#767e8d; cursor:pointer; white-space:nowrap;">BLOCKED</span>
            </div>
            <!-- LINE 2: count · [spacer] · EgressChip · Adjust -->
            <div style="display:flex; align-items:center; gap:6px;">
              <span style="font:12px/1 'JetBrains Mono','SFMono-Regular','SF Mono',Consolas,'Liberation Mono',monospace; color:#9ba2b0; white-space:nowrap;">3 overdue · 5 due this week</span>
              <span style="flex:1;"></span>
              <span style="display:inline-flex; align-items:center; min-height:18px; padding:0 8px; border:1px solid #2a2e3e; border-radius:0; background:rgba(0,0,0,0.28); box-shadow:inset 1px 1px 0 rgba(0,0,0,0.30), inset -1px -1px 0 rgba(255,255,255,0.07); font:600 10px/1 'JetBrains Mono','SFMono-Regular','SF Mono',Consolas,'Liberation Mono',monospace; letter-spacing:0.08em; text-transform:uppercase; color:#a86e4a; white-space:nowrap;">KAROLSANEAPPLE.ATLASSIAN.NET</span>
              <button type="button" style="min-height:28px; padding:4px 12px; border:1px solid transparent; border-radius:0; background:transparent; color:#f2f3f5; font:600 12px/1 'JetBrains Mono','SFMono-Regular','SF Mono',Consolas,'Liberation Mono',monospace; cursor:pointer;">Adjust</button>
            </div>
          </div>
        </div>

      </div>
    </div>

  </div>

  <!-- ─── FOOTER (SurfaceFooter) ─── -->
  <footer style="height:36px; padding:0 8px; background:#1c1f27; border-top:1px solid #2a2e3e; box-shadow:inset 1px 1px 0 rgba(255,255,255,0.14), inset -1px -1px 0 rgba(0,0,0,0.40); flex-shrink:0;">
    <div style="display:grid; grid-template-columns:max-content minmax(0,1fr) max-content; align-items:center; height:100%; gap:6px;">
      <!-- Receipt -->
      <span style="font:600 10px/1 'JetBrains Mono','SFMono-Regular','SF Mono',Consolas,'Liberation Mono',monospace; letter-spacing:0.06em; text-transform:uppercase; color:#9ba2b0;">2 SOURCES · 4 WATCHES</span>
      <span></span>
      <!-- Verbs -->
      <div style="display:flex; justify-content:flex-end; align-items:center; gap:4px;">
        <button style="min-height:28px; display:inline-flex; align-items:center; justify-content:center; padding:4px 12px; border:1px solid transparent; border-radius:0; background:transparent; color:#9ba2b0; font:600 12px/1 'JetBrains Mono','SFMono-Regular','SF Mono',Consolas,'Liberation Mono',monospace; cursor:pointer;">Cancel</button>
        <button style="min-height:28px; display:inline-flex; align-items:center; justify-content:center; padding:4px 12px; border:1px solid #a86e4a; border-radius:0; background:#a86e4a; color:#f2f3f5; font:600 12px/1 'JetBrains Mono','SFMono-Regular','SF Mono',Consolas,'Liberation Mono',monospace; cursor:pointer; box-shadow:inset 0 1px 0 rgba(255,255,255,0.22), 0 1px 2px rgba(0,0,0,0.3);">Create Project</button>
      </div>
    </div>
  </footer>

</div>
</x-dc>
</body>
</html>

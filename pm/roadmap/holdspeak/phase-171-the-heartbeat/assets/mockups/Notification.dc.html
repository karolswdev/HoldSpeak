<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600;650;700&amp;family=Space+Grotesk:wght@600;650;700&amp;display=swap">
  <style>
    body { margin: 0; background: #0e0f13; }
  </style>
</helmet>

<!-- ═══ macOS NOTIFICATION — needs you banner ═══ -->
<!-- 360x72, the macOS banner shape: rounded, translucent background,
     app glyph + title + body + time. Text only, no sentence beyond
     the count line. Nothing leaves the machine (Article III). -->
<div style="width:360px; display:flex; flex-direction:column; gap:24px;">

  <!-- State 1: needs you -->
  <div style="width:360px; height:72px; display:flex; align-items:center; gap:12px; padding:12px 16px; border-radius:14px; background:rgba(40,42,54,0.92); backdrop-filter:blur(30px); box-shadow:0 4px 20px rgba(0,0,0,0.4), inset 0 0.5px 0 rgba(255,255,255,0.08); box-sizing:border-box;">
    <!-- App glyph (a simple square representing the HoldSpeak icon) -->
    <div style="width:36px; height:36px; border-radius:8px; background:#1c1f27; border:1px solid #363b50; display:grid; place-items:center; flex-shrink:0;">
      <span style="font:700 14px/1 'Space Grotesk','Inter',system-ui,sans-serif; color:#a86e4a;">H</span>
    </div>
    <div style="flex:1; min-width:0; display:flex; flex-direction:column; gap:2px;">
      <div style="display:flex; align-items:center; justify-content:space-between; gap:8px;">
        <span style="font:600 13px/1 -apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',sans-serif; color:#f2f3f5;">HoldSpeak</span>
        <span style="font:400 12px/1 -apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',sans-serif; color:rgba(255,255,255,0.45); flex-shrink:0;">now</span>
      </div>
      <span style="font:400 13px/1.3 -apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',sans-serif; color:rgba(255,255,255,0.75);">3 need you across 2 projects</span>
    </div>
  </div>

  <!-- State 2: design-only — this banner is NEVER fired -->
  <div style="font:600 10px/1 'JetBrains Mono','SFMono-Regular','SF Mono',Consolas,'Liberation Mono',monospace; letter-spacing:0.06em; text-transform:uppercase; color:#767e8d; padding:0 0 6px;">SWALLOWED IN QUIET HOURS &middot; NEVER FIRED</div>
  <div style="width:360px; height:72px; display:flex; align-items:center; gap:12px; padding:12px 16px; border-radius:14px; background:rgba(40,42,54,0.92); backdrop-filter:blur(30px); box-shadow:0 4px 20px rgba(0,0,0,0.4), inset 0 0.5px 0 rgba(255,255,255,0.08); box-sizing:border-box;">
    <div style="width:36px; height:36px; border-radius:8px; background:#1c1f27; border:1px solid #363b50; display:grid; place-items:center; flex-shrink:0;">
      <span style="font:700 14px/1 'Space Grotesk','Inter',system-ui,sans-serif; color:#a86e4a;">H</span>
    </div>
    <div style="flex:1; min-width:0; display:flex; flex-direction:column; gap:2px;">
      <div style="display:flex; align-items:center; justify-content:space-between; gap:8px;">
        <span style="font:600 13px/1 -apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',sans-serif; color:#f2f3f5;">HoldSpeak</span>
        <span style="font:400 12px/1 -apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',sans-serif; color:rgba(255,255,255,0.45); flex-shrink:0;">08:00</span>
      </div>
      <span style="font:400 13px/1.3 -apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',sans-serif; color:rgba(255,255,255,0.55);">Quiet hours &middot; held until 08:00</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>

<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600;650;700&amp;family=Space+Grotesk:wght@600;650;700&amp;display=swap">
  <style>
    body { margin: 0; background: #0e0f13; }
  </style>
</helmet>

<!-- StewardPolicyEffects (640) -- policy GadgetGroup with Effects rows -->
<div style="width:640px; border:1px solid #363b50; border-radius:2px; background:#15171d; box-shadow:inset 1px 1px 0 rgba(255,255,255,0.14), inset -1px -1px 0 rgba(0,0,0,0.40), inset 0 0 0 1px #2a2e3e; display:flex; flex-direction:column;">

  <!-- TITLE BAR -->
  <div style="height:40px; padding:0 12px; display:flex; align-items:center; gap:10px; background:#242833; border-radius:1px 1px 0 0; flex-shrink:0;">
    <div style="display:flex; gap:6px; align-items:center; flex-shrink:0;">
      <span style="width:12px; height:12px; border-radius:2px; background:#f87171; display:block;"></span>
      <span style="width:12px; height:12px; border-radius:2px; background:#fbbf24; display:block;"></span>
      <span style="width:12px; height:12px; border-radius:2px; background:#34d399; display:block;"></span>
    </div>
    <span style="flex:1; min-width:0; font:700 14px/1 'Space Grotesk','Inter',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; color:#f2f3f5; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">Ship the Q4 platform on schedule</span>
    <div style="display:flex; align-items:center; flex-shrink:0;">
      <span style="padding:4px 12px; border:1px solid #2a2e3e; border-radius:2px; background:#1c1f27; box-shadow:inset 1px 1px 0 rgba(255,255,255,0.14), inset -1px -1px 0 rgba(0,0,0,0.40); font:600 10px/1 'JetBrains Mono','SFMono-Regular','SF Mono',Consolas,'Liberation Mono',monospace; letter-spacing:0.06em; text-transform:uppercase; color:#9ba2b0; cursor:pointer; white-space:nowrap;">Room</span>
      <span style="margin-left:-1px; padding:4px 12px; border:1px solid #2a2e3e; border-radius:2px; background:rgba(0,0,0,0.28); box-shadow:inset 1px 1px 0 rgba(0,0,0,0.30), inset -1px -1px 0 rgba(255,255,255,0.07); font:600 10px/1 'JetBrains Mono','SFMono-Regular','SF Mono',Consolas,'Liberation Mono',monospace; letter-spacing:0.06em; text-transform:uppercase; color:#f2f3f5; cursor:pointer; white-space:nowrap;">Steward</span>
    </div>
  </div>

  <!-- BODY -->
  <div style="flex:1; padding:16px 20px 14px; display:flex; flex-direction:column; gap:20px;">

    <!-- GadgetGroup: Steward policy -->
    <div style="display:flex; flex-direction:column; gap:4px;">
      <div style="font:600 11px/1 'JetBrains Mono','SFMono-Regular','SF Mono',Consolas,'Liberation Mono',monospace; letter-spacing:0.06em; text-transform:uppercase; color:#767e8d; margin-bottom:6px;">Steward policy</div>

      <!-- GadgetRow: Effects label -->
      <div style="display:flex; align-items:flex-start; gap:8px; padding:10px 0; border-top:1px solid #2a2e3e;">
        <span style="font:600 15px/1.4 'Inter',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; color:#f2f3f5; white-space:nowrap; flex-shrink:0; padding-top:4px;">Effects</span>
        <div style="flex:1; display:flex; flex-direction:column; gap:10px;">

          <!-- Row 1: Refreshed sources -- CHECKED -->
          <div style="display:flex; align-items:center; gap:8px;">
            <button type="button" style="display:inline-flex; align-items:center; justify-content:center; width:28px; height:28px; border:1px solid #2a2e3e; border-radius:2px; background:#1c1f27; box-shadow:inset 1px 1px 0 rgba(255,255,255,0.14), inset -1px -1px 0 rgba(0,0,0,0.40); cursor:pointer; flex-shrink:0;">
              <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="2.5,6 5,8.5 9.5,3.5"></polyline></svg>
            </button>
            <span style="font:600 13px/1.4 'Inter',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; color:#f2f3f5;">Refreshed sources</span>
          </div>

          <!-- Row 2: Created proposals -- CHECKED -->
          <div style="display:flex; align-items:center; gap:8px;">
            <button type="button" style="display:inline-flex; align-items:center; justify-content:center; width:28px; height:28px; border:1px solid #2a2e3e; border-radius:2px; background:#1c1f27; box-shadow:inset 1px 1px 0 rgba(255,255,255,0.14), inset -1px -1px 0 rgba(0,0,0,0.40); cursor:pointer; flex-shrink:0;">
              <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="2.5,6 5,8.5 9.5,3.5"></polyline></svg>
            </button>
            <span style="font:600 13px/1.4 'Inter',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; color:#f2f3f5;">Created proposals</span>
          </div>

          <!-- Row 3: Applied proposal effects -- CHECKED -->
          <div style="display:flex; align-items:center; gap:8px;">
            <button type="button" style="display:inline-flex; align-items:center; justify-content:center; width:28px; height:28px; border:1px solid #2a2e3e; border-radius:2px; background:#1c1f27; box-shadow:inset 1px 1px 0 rgba(255,255,255,0.14), inset -1px -1px 0 rgba(0,0,0,0.40); cursor:pointer; flex-shrink:0;">
              <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="2.5,6 5,8.5 9.5,3.5"></polyline></svg>
            </button>
            <span style="font:600 13px/1.4 'Inter',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; color:#f2f3f5;">Applied proposal effects</span>
          </div>

          <!-- Row 4: Drafted update -- CHECKED + EgressChip model -->
          <div style="display:flex; align-items:center; gap:8px;">
            <button type="button" style="display:inline-flex; align-items:center; justify-content:center; width:28px; height:28px; border:1px solid #2a2e3e; border-radius:2px; background:#1c1f27; box-shadow:inset 1px 1px 0 rgba(255,255,255,0.14), inset -1px -1px 0 rgba(0,0,0,0.40); cursor:pointer; flex-shrink:0;">
              <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="2.5,6 5,8.5 9.5,3.5"></polyline></svg>
            </button>
            <span style="font:600 13px/1.4 'Inter',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; color:#f2f3f5;">Drafted update</span>
            <!-- EgressChip: model (existing -- isModelTouchingKind) -->
            <span style="display:inline-flex; align-items:center; min-height:18px; padding:0 8px; border:1px solid #2a2e3e; border-radius:0; background:rgba(0,0,0,0.28); box-shadow:inset 1px 1px 0 rgba(0,0,0,0.30), inset -1px -1px 0 rgba(255,255,255,0.07); font:600 10px/1 'JetBrains Mono','SFMono-Regular','SF Mono',Consolas,'Liberation Mono',monospace; letter-spacing:0.08em; text-transform:uppercase; color:#a86e4a; white-space:nowrap; flex-shrink:0;">MODEL</span>
          </div>

          <!-- Row 5: Door item created -- CHECKED -->
          <div style="display:flex; align-items:center; gap:8px;">
            <button type="button" style="display:inline-flex; align-items:center; justify-content:center; width:28px; height:28px; border:1px solid #2a2e3e; border-radius:2px; background:#1c1f27; box-shadow:inset 1px 1px 0 rgba(255,255,255,0.14), inset -1px -1px 0 rgba(0,0,0,0.40); cursor:pointer; flex-shrink:0;">
              <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="2.5,6 5,8.5 9.5,3.5"></polyline></svg>
            </button>
            <span style="font:600 13px/1.4 'Inter',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; color:#f2f3f5;">Door item created</span>
          </div>

          <!-- Row 6: Reviewer nudge -- UNCHECKED + EgressChip GITHUB.COM (173 new) -->
          <div style="display:flex; align-items:center; gap:8px;">
            <button type="button" style="display:inline-flex; align-items:center; justify-content:center; width:28px; height:28px; border:1px solid #2a2e3e; border-radius:2px; background:#1c1f27; box-shadow:inset 1px 1px 0 rgba(255,255,255,0.14), inset -1px -1px 0 rgba(0,0,0,0.40); cursor:pointer; flex-shrink:0;">
              <!-- empty -- unchecked -->
            </button>
            <span style="font:600 13px/1.4 'Inter',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; color:#9ba2b0;">Reviewer nudge</span>
            <!-- EgressChip: GITHUB.COM (the host the effect writes to) -->
            <span style="display:inline-flex; align-items:center; min-height:18px; padding:0 8px; border:1px solid #2a2e3e; border-radius:0; background:rgba(0,0,0,0.28); box-shadow:inset 1px 1px 0 rgba(0,0,0,0.30), inset -1px -1px 0 rgba(255,255,255,0.07); font:600 10px/1 'JetBrains Mono','SFMono-Regular','SF Mono',Consolas,'Liberation Mono',monospace; letter-spacing:0.08em; text-transform:uppercase; color:#a86e4a; white-space:nowrap; flex-shrink:0;">GITHUB.COM</span>
          </div>

          <!-- Caption: PER-NUDGE APPROVAL (the double gate) -->
          <div style="padding-top:2px;">
            <span style="font:600 11px/1 'JetBrains Mono','SFMono-Regular','SF Mono',Consolas,'Liberation Mono',monospace; letter-spacing:0.06em; text-transform:uppercase; color:#767e8d;">PER-NUDGE APPROVAL</span>
          </div>

        </div>
      </div>
    </div>

  </div>

  <!-- FOOTER -->
  <footer style="height:36px; padding:0 12px; background:#1c1f27; border-top:1px solid #2a2e3e; box-shadow:inset 1px 1px 0 rgba(255,255,255,0.14), inset -1px -1px 0 rgba(0,0,0,0.40); flex-shrink:0;">
    <div style="display:flex; align-items:center; justify-content:space-between; height:100%; gap:8px;">
      <span style="font:600 10px/1 'JetBrains Mono','SFMono-Regular','SF Mono',Consolas,'Liberation Mono',monospace; letter-spacing:0.06em; text-transform:uppercase; color:#767e8d;">STEWARD POLICY</span>
      <button type="button" style="min-height:24px; padding:2px 8px; border:1px solid #a86e4a; border-radius:0; background:#a86e4a; color:#f2f3f5; font:600 11px/1 'JetBrains Mono','SFMono-Regular','SF Mono',Consolas,'Liberation Mono',monospace; box-shadow:inset 0 1px 0 rgba(255,255,255,0.22), 0 1px 2px rgba(0,0,0,0.3); cursor:pointer; flex-shrink:0;">Save</button>
    </div>
  </footer>

</div>
</x-dc>
</body>
</html>

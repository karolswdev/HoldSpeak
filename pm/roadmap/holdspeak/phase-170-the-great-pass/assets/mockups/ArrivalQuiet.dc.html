<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600;650;700&amp;family=Space+Grotesk:wght@600;650;700&amp;display=swap">
  <style>
    body { margin: 0; background: #0e0f13; }
  </style>
</helmet>

<!-- ═══ THE ARRIVAL — quiet, 1440×900 desk ═══ -->
<div style="width:1440px; height:900px; background:#0e0f13; display:flex; flex-direction:column; overflow:hidden;">

  <!-- ─── MENU BAR ─── -->
  <div style="height:28px; padding:0 16px; display:flex; align-items:center; gap:16px; background:#1c1f27; border-bottom:1px solid #2a2e3e; flex-shrink:0;">
    <div style="display:flex; align-items:center; gap:12px;">
      <span style="font:700 13px/1 'JetBrains Mono','SFMono-Regular','SF Mono',Consolas,'Liberation Mono',monospace; color:#f2f3f5;">HoldSpeak</span>
      <span style="font:13px/1 'JetBrains Mono','SFMono-Regular','SF Mono',Consolas,'Liberation Mono',monospace; color:#9ba2b0;">Desk</span>
      <span style="font:13px/1 'JetBrains Mono','SFMono-Regular','SF Mono',Consolas,'Liberation Mono',monospace; color:#9ba2b0;">Object</span>
      <span style="font:13px/1 'JetBrains Mono','SFMono-Regular','SF Mono',Consolas,'Liberation Mono',monospace; color:#9ba2b0;">Go</span>
      <span style="font:13px/1 'JetBrains Mono','SFMono-Regular','SF Mono',Consolas,'Liberation Mono',monospace; color:#9ba2b0;">Window</span>
    </div>
    <div style="display:flex; align-items:center; gap:6px; margin-left:12px;">
      <span style="width:8px; height:8px; background:#34d399; border-radius:1px; flex-shrink:0;"></span>
      <span style="font:12px/1 'JetBrains Mono','SFMono-Regular','SF Mono',Consolas,'Liberation Mono',monospace; letter-spacing:0.04em; color:#9ba2b0; text-transform:uppercase;">EXTERNAL REACH ENABLED</span>
    </div>
    <span style="flex:1;"></span>
    <div style="display:flex; align-items:center; gap:16px;">
      <span style="font:12px/1 'JetBrains Mono','SFMono-Regular','SF Mono',Consolas,'Liberation Mono',monospace; color:#9ba2b0;">Search &#8984;K</span>
      <span style="font:12px/1 'JetBrains Mono','SFMono-Regular','SF Mono',Consolas,'Liberation Mono',monospace; color:#9ba2b0;">Fri, Sep 4 10:46 PM</span>
    </div>
  </div>

  <!-- ─── DESK CONTENT ─── -->
  <div style="flex:1; display:flex; justify-content:center; padding:0 40px; overflow:hidden;">
    <div style="width:100%; max-width:800px; display:flex; flex-direction:column; padding:40px 0 20px;">

      <!-- ═══ HEAD — muted, nothing needs you ═══ -->
      <div style="display:flex; flex-direction:column; gap:6px;">
        <!-- Headline: display step, muted -->
        <div style="font:650 26px/1.15 'Space Grotesk','Inter',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; color:#767e8d;">Nothing needs you</div>
        <!-- No NEXT line when nothing needs you -->
      </div>

      <!-- NO sections — empty sections are absent -->
      <!-- The headline said it all; calm -->

      <!-- SPACER (pushes capture bar to foot) -->
      <div style="flex:1;"></div>

      <!-- ═══ CAPTURE BAR (the foot) ═══ -->
      <div style="display:flex; align-items:center; gap:8px; padding:10px 12px; background:#1c1f27; border:1px solid #2a2e3e; border-radius:2px; box-shadow:inset 1px 1px 0 rgba(0,0,0,0.30), inset -1px -1px 0 rgba(255,255,255,0.07);">
        <!-- Talk: mic transport, primary -->
        <button type="button" style="display:inline-flex; align-items:center; gap:6px; min-height:28px; padding:4px 12px; border:1px solid #a86e4a; border-radius:0; background:#a86e4a; color:#f2f3f5; font:600 12px/1 'JetBrains Mono','SFMono-Regular','SF Mono',Consolas,'Liberation Mono',monospace; box-shadow:inset 0 1px 0 rgba(255,255,255,0.22), 0 1px 2px rgba(0,0,0,0.3); cursor:pointer; flex-shrink:0;">
          <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="#f2f3f5" stroke-width="1.5" stroke-linecap="round"><rect x="5" y="1" width="6" height="10" rx="3"></rect><path d="M3 8a5 5 0 0010 0"></path><line x1="8" y1="13" x2="8" y2="15"></line></svg>
          Talk
        </button>
        <!-- Develop a thought: ghost -->
        <button type="button" style="min-height:28px; padding:4px 12px; border:1px solid transparent; border-radius:0; background:transparent; color:#9ba2b0; font:600 12px/1 'JetBrains Mono','SFMono-Regular','SF Mono',Consolas,'Liberation Mono',monospace; cursor:pointer;">Develop a thought</button>
        <!-- Record meeting: ghost -->
        <button type="button" style="min-height:28px; padding:4px 12px; border:1px solid transparent; border-radius:0; background:transparent; color:#9ba2b0; font:600 12px/1 'JetBrains Mono','SFMono-Regular','SF Mono',Consolas,'Liberation Mono',monospace; cursor:pointer;">Record meeting</button>
      </div>

    </div>
  </div>

  <!-- ─── DOCK ─── -->
  <div style="height:40px; padding:0 20px; display:flex; align-items:center; justify-content:center; gap:24px; background:#1c1f27; border-top:1px solid #2a2e3e; flex-shrink:0;">
    <span style="font:12px/1 'JetBrains Mono','SFMono-Regular','SF Mono',Consolas,'Liberation Mono',monospace; color:#9ba2b0; cursor:pointer;">Intelligence</span>
    <span style="font:12px/1 'JetBrains Mono','SFMono-Regular','SF Mono',Consolas,'Liberation Mono',monospace; color:#9ba2b0; cursor:pointer;">Speak</span>
    <span style="font:12px/1 'JetBrains Mono','SFMono-Regular','SF Mono',Consolas,'Liberation Mono',monospace; color:#9ba2b0; cursor:pointer;">Meetings</span>
    <span style="font:12px/1 'JetBrains Mono','SFMono-Regular','SF Mono',Consolas,'Liberation Mono',monospace; color:#9ba2b0; cursor:pointer;">Agents</span>
    <span style="font:12px/1 'JetBrains Mono','SFMono-Regular','SF Mono',Consolas,'Liberation Mono',monospace; color:#9ba2b0; cursor:pointer;">Settings</span>
    <span style="font:12px/1 'JetBrains Mono','SFMono-Regular','SF Mono',Consolas,'Liberation Mono',monospace; color:#9ba2b0; cursor:pointer;">Floor</span>
    <span style="font:12px/1 'JetBrains Mono','SFMono-Regular','SF Mono',Consolas,'Liberation Mono',monospace; color:#9ba2b0; cursor:pointer;">Desk memory</span>
    <span style="font:12px/1 'JetBrains Mono','SFMono-Regular','SF Mono',Consolas,'Liberation Mono',monospace; color:#9ba2b0; cursor:pointer;">Delivery</span>
    <span style="font:12px/1 'JetBrains Mono','SFMono-Regular','SF Mono',Consolas,'Liberation Mono',monospace; color:#9ba2b0; cursor:pointer;">Panes</span>
  </div>

</div>
</x-dc>
</body>
</html>
